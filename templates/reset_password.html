<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:#111827;
            padding:30px;
            border-radius:16px;
            width:350px;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:10px;
            background:#1f2937;
            color:white;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#3b82f6;
            color:white;
            font-weight:bold;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#2563eb;
        }

        .link{
            text-align:center;
            margin-top:15px;
            color:#9ca3af;
            font-size:13px;
        }

        .link a{
            color:#60a5fa;
            text-decoration:none;
        }
    </style>

</head>
<body>

<div class="box">

    <h2>Reset Password</h2>

    <form method="POST">

        <input type="password" name="password" placeholder="New Password" required>

        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Update Password</button>

    </form>

    <div class="link">
        Back to <a href="{{ url_for('login') }}">Login</a>
    </div>

</div>

</body>
</html>
