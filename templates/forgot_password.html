<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - NOVA AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:450px;
    background:rgba(15,23,42,0.9);
    padding:40px;
    border-radius:28px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo img{
    width:90px;
    height:90px;
    object-fit:contain;
    margin-bottom:15px;
}

.logo h1{
    color:white;
    font-size:32px;
}

.logo p{
    color:#94a3b8;
    margin-top:5px;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h2{
    color:white;
    margin-bottom:10px;
}

.title p{
    color:#94a3b8;
    line-height:1.7;
    font-size:14px;
}

.input-group{
    margin-bottom:22px;
}

.input-group label{
    display:block;
    margin-bottom:10px;
    color:#cbd5e1;
}

.input-box{
    position:relative;
}

.input-box i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#38bdf8;
}

.input-box input{
    width:100%;
    padding:16px 16px 16px 50px;
    border:none;
    outline:none;
    border-radius:16px;
    background:rgba(255,255,255,0.05);
    color:white;
    border:1px solid rgba(255,255,255,0.08);
    font-size:15px;
}

.input-box input:focus{
    border-color:#38bdf8;
}

.reset-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#0ea5e9,#06b6d4);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.reset-btn:hover{
    transform:translateY(-3px);
}

.bottom-link{
    text-align:center;
    margin-top:25px;
}

.bottom-link a{
    color:#38bdf8;
    text-decoration:none;
}

.flash{
    background:rgba(239,68,68,0.15);
    color:#fca5a5;
    padding:14px;
    border-radius:14px;
    margin-bottom:20px;
    text-align:center;
}

</style>
</head>
<body>

<div class="container">

    <div class="logo">

        <img 
            src="{{ url_for('static', filename='img/chatbot logo.png') }}"
        >

        <h1>NOVA AI</h1>

        <p>Intelligence Studio</p>

    </div>

    <div class="title">

        <h2>Forgot Password</h2>

        <p>
            Enter your username and email
            to reset your password.
        </p>

    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="input-group">

            <label>Username</label>

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input 
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>

        </div>

        <div class="input-group">

            <label>Email Address</label>

            <div class="input-box">

                <i class="fas fa-envelope"></i>

                <input 
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>

        </div>

        <button type="submit" class="reset-btn">

            <i class="fas fa-key"></i>
            Verify Account

        </button>

    </form>

    <div class="bottom-link">

        <a href="{{ url_for('login') }}">
            <i class="fas fa-arrow-left"></i>
            Back to Login
        </a>

    </div>

</div>

</body>
</html>
